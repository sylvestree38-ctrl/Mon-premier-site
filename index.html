<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini catalogue Tailwind</title>

    <head>

        <!-- Tailwind CSS v4 CDN -->
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    </head>

<body class="bg-gray-100">
    <header class="text-center p-6">
        <h1 class="text-3xl font-bold mb-8">
            Mon catalogue</h1>
        <p class="text-gray-600 mt-2">
            Nos produits technologiques</p>
    </header>
    <main class="max-w-6xl mx-auto  p-6"></main>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

        <article class="relative bg-white p-6 border rounded-xl shadow">

            <!-- Badge -->
            <span class="absolute top-3 right-3 bg-green-600 text-white text-xs px-3 py-1 rounded-full">
                Nouveau
            </span>

            <img src="images/casque.jpg.webp" alt="Casque Bluetooth noir" class="w-full h-48 object-contain rounded-lg">
            <!--Nom-->
            <h2 class="text-xl font-bold mt-4">
                Casque Bluetooth
            </h2>

            <!--Description-->
            <p class="text-gray-600 mt-2">
                Un casque sans fil confortable.
            </p>

            <!--Prix-->
            <p class="text-lg font-bold">49,99 $</p>

            <!--Bouton-->
            <button class="bg-red-500 hover:bg-green-500 text-white px-4 py-2 rounded-lg mt-4">
                Voir les détails
            </button>
        </article>

        <article class="bg-white p-6 rounded-xl shadow">

    <!-- Image -->
    <img
        src="images/smartphone.jpeg"
        alt="Smartphone moderne"
        class="w-full h-48 object-contain rounded-lg"
    >

    <!-- Nom -->
    <h2 class="text-xl font-bold mt-4">
        Smartphone
    </h2>

    <!-- Description -->
    <p class="text-gray-600 mt-2">
        Un téléphone rapide et moderne.
    </p>

    <!-- Prix -->
    <p class="text-lg font-bold mt-3">
        299,99 $
    </p>

    <!-- Bouton -->
    <button
        type="button"
        class="bg-red-500 hover:bg-green-500 text-white px-4 py-2 rounded-lg mt-4"
    >
        Voir les détails
    </button>

</article>

    </div>

    </main>
</body>

</html>
